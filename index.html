<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>二人で〇〇しないと出られない部屋｜十二支版</title>
<style>
:root{--b:#070707;--p:#ff0a8a;--w:#070707}*{box-sizing:border-box}body{margin:0;background:var(--w);color:#fff;font-family:Arial,"Yu Gothic",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(135deg,transparent 0 20px,var(--p) 21px 22px,transparent 23px 42px)}main{width:min(100%,560px);margin:auto;padding:32px 22px}.tag{display:inline-block;background:var(--p);color:#fff;border-left:7px solid #fff;padding:7px 13px;font-weight:900;letter-spacing:.15em;transform:rotate(-2deg)}h1{font-size:clamp(31px,9vw,50px);line-height:1.05;letter-spacing:-.05em;margin:26px 0 10px;font-weight:900}.pink,.em{color:#fff}.bar{width:90px;height:9px;background:var(--p);transform:skewX(-35deg);margin:18px 0 25px}.desc{font-size:13px;line-height:1.8;color:#ddd;font-weight:700}button{width:100%;min-height:58px;margin-top:26px;border:0;background:var(--p);color:#fff;font-weight:900;font-size:17px;letter-spacing:.08em;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);box-shadow:7px 7px 0 var(--b);cursor:pointer}button:active{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--b)}#result{display:none}.label{margin-top:8px;font-size:12px;font-weight:900;letter-spacing:.2em}.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:13px;align-items:center;margin:22px 0 28px}.person{height:146px;display:flex;align-items:center;justify-content:center;background:var(--p);color:#fff;font-size:62px;font-weight:900;position:relative;overflow:hidden;isolation:isolate;text-shadow:3px 3px 0 #000}.person:before{content:"";position:absolute;width:118px;height:118px;border:7px solid var(--p);border-radius:50%;opacity:.55;z-index:-1;left:-28px;top:-30px;box-shadow:0 0 0 10px var(--b),0 0 0 14px var(--p),0 0 0 25px var(--b),0 0 0 28px var(--p)}.person:after{content:"";position:absolute;inset:-18px -14px -20px 42%;z-index:-1;opacity:.78;background:radial-gradient(circle at 58% 30%,var(--p) 0 5px,transparent 6px),radial-gradient(circle at 78% 20%,var(--p) 0 3px,transparent 4px),radial-gradient(circle at 88% 58%,var(--p) 0 6px,transparent 7px),radial-gradient(circle at 62% 72%,var(--p) 0 4px,transparent 5px),radial-gradient(circle at 38% 46%,var(--p) 0 9px,transparent 10px),linear-gradient(118deg,transparent 0 32%,#56052f 33% 60%,var(--p) 61% 66%,transparent 67%)}.x{color:var(--p);font-size:38px;font-weight:900;transform:rotate(-9deg);text-shadow:2px 2px 0 #fff}.mission{border-top:9px solid #fff;border-bottom:2px solid #fff;padding:18px 14px 21px;position:relative;background:var(--p);clip-path:polygon(2% 0,100% 0,98% 100%,0 100%)}.mission:before{content:"MISSION";position:absolute;right:0;top:-25px;background:#fff;color:var(--b);padding:3px 8px;font-size:11px;font-weight:900}.num{color:#fff;font-size:14px;font-weight:900;margin-bottom:10px}.prompt{font-weight:900;font-size:20px;line-height:1.75;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.22)}.em{font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}.nowrap{white-space:nowrap;display:inline-block}.note,.footer{text-align:center;color:#aaa;font-size:10px}.note{margin-top:10px}.footer{border-top:1px solid #555;margin-top:35px;padding-top:13px;letter-spacing:.1em}@media(max-width:380px){main{padding-left:17px;padding-right:17px}.person{height:125px;font-size:52px}.prompt{font-size:18px}}</style></head><body><main>
<section id="intro"><div class="tag">RANDOM MATCH</div><h1>二人で<span class="pink">〇〇</span>しないと<br>出られない部屋</h1><div class="bar"></div><p class="desc">入室者二名とミッションをランダムに抽選します。<br>何が起きるかは、部屋に入ってからのお楽しみ。</p><button id="enterBtn">部屋に入る</button></section>
<section id="result" aria-live="polite"><div class="tag">MATCH RESULT</div><div class="label">今回の入室者</div><div class="pair"><div class="person" id="personA"></div><div class="x">×</div><div class="person" id="personB"></div></div><div class="mission"><div class="num" id="promptNum"></div><div class="prompt" id="promptText"></div></div><button id="rerollBtn">WHO'S NEXT?</button><div class="note">※ 抽選結果は毎回ランダムです</div></section>
<footer class="footer">お題20種　｜　26.10更新</footer>
</main><script>
(()=>{const members=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"],favorite=["動物","飲み物","色","食べ物","乗り物"],association=["春","夏","秋","冬","動物園","水族館","黄色","赤色","青色"],nums=["壱","弐","参","肆","伍","陸","漆","捌","玖","拾","拾壱","拾弐","拾参","拾肆","拾伍","拾陸","拾漆","拾捌","拾玖","弐拾"];
const prompts=["二人の共通点を5つ見つけないと出られない","二人で料理を一品作らないと出られない","二人で1000ピースのジグソーパズルを完成させないと出られない","お互いの似顔絵を描かないと出られない","二人でトランプタワーを5段積まないと出られない","二人でホールケーキを一つ食べ切らないと出られない","二人で合計100回腹筋をしないと出られない","二人でホラー映画を1本鑑賞しないと出られない","二人で流行りのダンスの振り付けを完コピしないと出られない","お互いに相手に似合うコスプレを選び、着替えないと出られない","どちらかが寝つかないと出られない","相手の好きなところと嫌いなところを一つずつ言わないと出られない","お互いに自分の嫌いな食べ物を一つずつ食べないと出られない","お互いの肌が触れた状態で5分間過ごさないと出られない","部屋に隠された暗号を解かないと出られない",null,null,"二人のどちらかがどちらかを抱えて合計10m運ばないと出られない",null,null];
const intro=document.getElementById("intro"),result=document.getElementById("result"),personA=document.getElementById("personA"),personB=document.getElementById("personB"),promptNum=document.getElementById("promptNum"),promptText=document.getElementById("promptText");const pick=a=>a[Math.floor(Math.random()*a.length)];
function draw(){let ai=Math.floor(Math.random()*12),bi;do{bi=Math.floor(Math.random()*12)}while(bi===ai);let pi=Math.floor(Math.random()*20),t=prompts[pi];if(pi===15){let x=pick(favorite);t=`相手の好きな<span class="nowrap">「<span class="em">${x}</span>」</span>を当てないと出られない`}else if(pi===16){let x=pick(association);t=`<span class="nowrap">「<span class="em">${x}</span>といえば？」</span>に、二人で「せーの」で同じ答えを出さないと出られない`}else if(pi===18){let x=pick(members.filter((_,i)=>i!==ai&&i!==bi));t=`<span class="nowrap">「<span class="em">${x}</span>」</span>とのエピソードを、それぞれ一つ以上話さないと出られない`}else if(pi===19)t=`<span class="em">「自らの罪」</span>について互いに一つ話さないと出られない`;personA.textContent=members[ai];personB.textContent=members[bi];promptNum.textContent=`MISSION ${String(pi+1).padStart(2,"0")}`;promptText.innerHTML=t;intro.style.display="none";result.style.display="block";window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("enterBtn").addEventListener("click",draw);document.getElementById("rerollBtn").addEventListener("click",draw)})();
</script></body></html>
